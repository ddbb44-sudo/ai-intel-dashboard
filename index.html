*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  font-family:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(250,249,247,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1320px;margin:0 auto;padding:11px 18px;display:flex;gap:14px;align-items:center}
/* فاصل سطر داخل flex — بلا أثر على سطح المكتب، ويكسر الشريط على الجوال. */
.hbreak{display:none}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;cursor:pointer}
.dot{width:22px;height:22px;border-radius:50%;background:var(--accent);flex:0 0 auto;position:relative}
.dot::after{content:'';position:absolute;left:50%;top:23%;transform:translateX(-50%);width:2.6px;height:54%;border-radius:1.3px;background:#fff}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.2px}
.brand span{color:var(--muted);font-size:11.5px;display:block;line-height:1.2;font-weight:400}
.search{flex:1;position:relative;max-width:520px}
.search input{width:100%;padding:9px 36px 9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none;transition:.15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);opacity:.42;pointer-events:none}
.topstat{margin-inline-start:auto;display:flex;gap:16px;color:var(--muted);font-size:12px;white-space:nowrap}
.topstat b{color:var(--ink);font-weight:600}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:.15s;order:-1}
.iconbtn:hover{background:var(--surface-2)}
/* التحديث: دوران أثناء الجلب، ويتوقّف مع prefers-reduced-motion */
@keyframes spin{to{transform:rotate(-360deg)}}
#refreshBtn.busy svg{animation:spin .9s linear infinite}
#refreshBtn.busy{pointer-events:none;opacity:.65}
@media (prefers-reduced-motion:reduce){#refreshBtn.busy svg{animation:none}}
body.fopen .iconbtn{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- layout ---------- */
.shell{max-width:1320px;margin:0 auto;padding:18px;display:grid;grid-template-columns:0 1fr;gap:0;align-items:start;
  transition:grid-template-columns .3s cubic-bezier(.4,0,.2,1), gap .3s cubic-bezier(.4,0,.2,1)}
body.fopen .shell{grid-template-columns:var(--panel) 1fr;gap:20px}
main{min-width:0}
aside{position:sticky;top:74px;max-height:calc(100vh - 92px);overflow:hidden;width:100%}
body.fopen aside{overflow-y:auto;overflow-x:hidden}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
.fpad{width:var(--panel);padding-inline-end:8px}
.fhead{position:sticky;top:0;z-index:3;background:var(--bg);padding:2px 0 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.fhead .live{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fhead .live b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.fhead .live span{font-size:12px;color:var(--muted)}
.fhead .closebtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto}
.fhead .closebtn:hover{color:var(--ink);background:var(--surface-2)}
.pulse{animation:pl .45s ease}
@keyframes pl{0%{transform:scale(1)}40%{transform:scale(1.18);color:var(--accent)}100%{transform:scale(1)}}
.fgroup{margin-bottom:16px}
.fgroup>h4{margin:0 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center}
.fgroup>h4 button{font-size:11px;color:var(--accent);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4.5px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;color:var(--ink-2);transition:.13s;white-space:nowrap;line-height:1.5}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.chip.pin{border-color:#e3d4cb;background:#fdf9f7;font-weight:500}
.chip.pin::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;margin-inline-end:5px;vertical-align:middle;opacity:.75}
.chip.pin.on::before{background:#fff}
.chip.empty{opacity:.45}
.chip .c{opacity:.5;font-size:10.5px;margin:0 6px;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.chip.on .c{opacity:.8}
.more{font-size:11.5px;color:var(--accent);margin-top:6px;font-weight:500}
.daterow{display:flex;gap:6px}
.daterow input{flex:1;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:12px;min-width:0}

/* ---------- feed ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.count{font-size:13px;color:var(--muted)}
.count b{color:var(--ink);font-weight:600}
.sortsel{margin-inline-start:auto;display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.sortsel button{padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--muted);transition:.13s}
.sortsel button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.afc{display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-2);font-size:12px;border:1px solid #f0dfd5}
.afc button{color:var(--accent-2);font-size:14px;line-height:1;opacity:.6}
.afc button:hover{opacity:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;margin-bottom:11px;box-shadow:var(--shadow);transition:.15s;position:relative}
.card:hover{border-color:var(--line-2);box-shadow:0 2px 4px rgba(34,32,29,.05),0 8px 22px rgba(34,32,29,.06)}
.chead{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
.av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;cursor:pointer;border:1px solid var(--line);
  background-image:var(--sprite);background-repeat:no-repeat;background-color:var(--surface-2)}
.av.lg{width:68px;height:68px}
.who{flex:1;min-width:0;line-height:1.45}
.who .nm{font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.who .nm:hover{color:var(--accent)}
.who .hd{color:var(--muted);font-size:12px}
.serial{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;direction:ltr;cursor:pointer;padding:2px 6px;border-radius:6px;background:var(--surface-2)}
.serial:hover{color:var(--accent);background:var(--accent-soft)}
.xlink{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto}
.xlink:hover{color:var(--ink);border-color:var(--line-2);background:var(--surface-2)}
.tag.tool{background:#eef2ff;border-color:#c7d2fe;color:#4338ca;font-weight:600}
.srcbtn{display:inline-flex;align-items:center;gap:6px;padding:0 11px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:inherit;font-size:12.5px;text-decoration:none;flex:0 0 auto}
.srcbtn:hover{color:var(--ink);border-color:var(--line-2)}
.srcbtn svg{width:13px;height:13px}
.opensrc{display:flex;align-items:center;gap:9px;margin-top:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);text-decoration:none;flex-wrap:wrap}
.opensrc:hover{border-color:var(--line-2);background:var(--surface)}
.opensrc svg{width:15px;height:15px;flex:0 0 auto}
.opensrc b{font-size:14px;font-weight:600}
.opensrc .u{font-size:12px;color:var(--muted);direction:ltr;unicode-bidi:embed;margin-inline-start:auto;word-break:break-all}
h3.t{margin:0 0 7px;font-size:16.5px;font-weight:600;line-height:1.6;letter-spacing:-.2px;cursor:pointer}
h3.t:hover{color:var(--accent-2)}
p.s{margin:0 0 11px;color:var(--ink-2);font-size:14px;line-height:1.8}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.tag{font-size:11.5px;padding:2.5px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);cursor:pointer}
.tag:hover{border-color:var(--faint);color:var(--ink-2)}
.tag.ent{background:var(--accent-soft);color:var(--accent-2);border-color:#f0dfd5}
.tag.chg{background:var(--ok-soft);color:var(--ok);border-color:#dbe9e0}
.tier{font-size:11px;padding:2.5px 8px;border-radius:6px;font-weight:600}
.tier.important{background:var(--accent-soft);color:var(--accent-2)}
.tier.useful{background:var(--ok-soft);color:var(--ok)}
.tier.low{background:var(--warn-soft);color:var(--warn)}
.dup{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:9px;padding:7px 10px;margin-bottom:11px;cursor:pointer}
.dup:hover{border-color:var(--accent);color:var(--accent-2)}
.cfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.met{display:flex;gap:13px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.met span{display:inline-flex;align-items:center;gap:4px}
.acts{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.act{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent;transition:.13s}
.act:hover{background:var(--surface-2);color:var(--ink)}
.act.on{color:var(--accent);background:var(--accent-soft)}
.readmore{font-size:13px;color:var(--accent);font-weight:600;padding:5px 11px;border-radius:8px;border:1px solid #f0dfd5;background:var(--accent-soft)}
.readmore:hover{background:#f2e0d7}

/* ---------- detail ---------- */
.detail{max-width:820px;margin:0 auto}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.backbtn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);padding:7px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface)}
.backbtn:hover{color:var(--ink);background:var(--surface-2)}
.dwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;box-shadow:var(--shadow)}
.dwrap h1{font-size:25px;line-height:1.55;margin:0 0 14px;font-weight:600;letter-spacing:-.4px}
.sec{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.sec h5{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--accent-2);letter-spacing:.4px;text-transform:none}
.sec p{margin:0 0 10px;line-height:1.95;color:var(--ink-2);font-size:14.5px;white-space:pre-wrap}
.orig{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.85;color:var(--ink-2);white-space:pre-wrap}
.gl{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.gl:last-child{border:0}
.gl b{flex:0 0 auto;font-weight:600;font-size:13.5px;color:var(--ink)}
.gl span{color:var(--muted);font-size:13.5px}
.lnk{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:13px;color:var(--accent-2);text-decoration:none;word-break:break-all;background:var(--surface-2)}
.lnk:hover{border-color:var(--accent);background:var(--accent-soft)}
.qbox{border-inline-start:3px solid var(--line-2);padding:2px 14px;color:var(--muted);font-size:14px;line-height:1.8;white-space:pre-wrap}
.metgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px}
.mcell{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.mcell b{display:block;font-size:17px;font-variant-numeric:tabular-nums;direction:ltr;font-weight:600}
.mcell span{font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--faint);margin-top:8px}

/* ---------- profile ---------- */
.phead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.phead .av.lg{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);cursor:default}
.pinfo{flex:1;min-width:220px}
.pinfo h2{margin:0 0 2px;font-size:20px;font-weight:600}
.pinfo .hd{color:var(--muted);font-size:13.5px;margin-bottom:8px}
.pinfo .bio{font-size:14px;color:var(--ink-2);line-height:1.8;margin-bottom:10px}
.pmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pmeta span{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 9px}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:600}

/* ---------- sheet / modal ---------- */
.ov{position:fixed;inset:0;background:rgba(34,32,29,.32);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);max-height:80vh;overflow:auto}
.modal h4{margin:0 0 4px;font-size:16px;font-weight:600}
.modal p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.collrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:14px}
.collrow:hover{border-color:var(--accent);background:var(--accent-soft)}
.collrow.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.newcoll{display:flex;gap:6px;margin-top:10px}
.newcoll input{flex:1;padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);outline:none}
.btn{padding:8px 14px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:13.5px}
.btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.iconbtn.hb{position:relative}
.badge{position:absolute;top:-5px;inset-inline-start:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;direction:ltr;border:2px solid var(--bg)}
.badge.zero{display:none}
.tray{position:fixed;top:60px;inset-inline-start:14px;width:min(420px,94vw);max-height:74vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);z-index:130;padding:12px 13px}
.trayhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.trayhd b{font-size:14.5px;font-weight:600}
.trayhd .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.trow{display:flex;gap:9px;align-items:flex-start;padding:8px;border-radius:10px;transition:.12s}
.trow:hover{background:var(--surface-2)}
.trow .av{width:28px;height:28px}
.trow .tt{flex:1;min-width:0;font-size:13px;line-height:1.6;cursor:pointer}
.trow .tt:hover{color:var(--accent-2)}
.trow .sn{font-size:10.5px;color:var(--faint);direction:ltr;font-variant-numeric:tabular-nums}
.trow .rm{width:26px;height:26px;border-radius:8px;color:var(--faint);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px}
.trow .rm:hover{background:var(--accent-soft);color:var(--accent-2)}
.trsec{font-size:11.5px;font-weight:600;color:var(--muted);margin:10px 2px 4px;display:flex;justify-content:space-between}
.trayfoot{display:flex;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.trayempty{text-align:center;padding:26px 10px;color:var(--muted);font-size:13.5px}
.dsel{display:flex;gap:6px;align-items:center;margin-top:7px}
.dsel label{font-size:11.5px;color:var(--muted);flex:0 0 auto}
.dsel select{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);font-size:12.5px;outline:none;cursor:pointer}
.dsel select:focus{border-color:var(--accent)}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:30px}

@media(max-width:1000px){
  .shell{padding:12px;grid-template-columns:1fr!important;gap:0!important}
  aside{position:fixed;top:57px;bottom:0;inset-inline-start:0;inset-inline-end:auto;width:min(80vw,320px);
    max-height:none;background:var(--bg);border-inline-end:1px solid var(--line-2);
    box-shadow:-14px 0 40px rgba(34,32,29,.16);z-index:80;overflow-y:auto;overflow-x:hidden;
    padding:12px 14px 40px;transform:translateX(101%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  body.fopen aside{transform:translateX(0)}
  .fpad{width:100%;padding-inline-end:0}
  .fhead{padding-top:0}
  .topstat{display:none}
  .brand span{display:none}
  .brand b{font-size:14px}
  .search input{font-size:14px}

  /* الجوال: شريطان بدل واحد محشور.
     كانت عشرة عناصر (الاسم · البحث · ستّ أيقونات · التحديث) في سطر واحد على
     ٣٧٥ بكسل، فيتقلّص كلٌّ منها إلى ما دون حجم اللمس المريح ويختنق البحث.
     الأعلى: الاسم يمينًا والتحديث يقابله. والأسفل: البحث وبقية الأيقونات. */
  .hwrap{flex-wrap:wrap; gap:6px; padding:9px 12px}
  /* الترتيب ٣: بين التحديث (٢) والبحث (٤). بلا هذا يبقى على الافتراضي
     صفرًا فيسبق كل شيء، والكسر يقع قبل الاسم لا بعد التحديث. */
  .hbreak{display:block; order:3; flex-basis:100%; height:0; margin:0}
  .brand{order:1; flex:1 1 auto; min-width:0; gap:8px}
  .brand b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #refreshBtn{order:2; margin-inline-start:auto}
  .search{order:4; flex:1 1 100px; max-width:none; min-width:92px}
  .search input{padding:7px 30px 7px 9px}
  .hwrap > .iconbtn{order:5; width:32px; height:32px; border-radius:8px}
  /* ٣٧٥ بكسل: ٢٤ حاشية + ٦ فجوات×٦ + ٦ أيقونات×٣٢ = ٢٤٤ — يبقى للبحث ١٣١. */
  .dwrap{padding:20px 18px}
  .dwrap h1{font-size:21px}
  .sortsel{width:100%;overflow-x:auto;margin-inline-start:0}
  .card{padding:14px}
  main{padding-inline-start:0}
}

.chips.scroll{max-height:230px;overflow-y:auto;padding-inline-end:4px}

.upbar{border-top:1px solid var(--line);background:rgba(253,249,247,.75)}
.upwrap{max-width:1320px;margin:0 auto;padding:7px 18px;display:flex;gap:8px 20px;flex-wrap:wrap;
  align-items:center;color:var(--muted);font-size:12px}

@media(max-width:700px){ .upwrap{font-size:11.5px;padding:6px 14px;gap:6px 12px} }

.bootmsg{max-width:520px;margin:90px auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}

.bootspin{width:26px;height:26px;margin:0 auto 14px;border:2.5px solid #e9e2dd;border-top-color:var(--accent);
  border-radius:50%;animation:bspin .8s linear infinite}

.av.badge{display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:50%;
  background-image:none;flex:0 0 auto;letter-spacing:0}

.iconbtn.addbtn{background:var(--accent);border-color:var(--accent);color:#fff}

button.go.danger{background:#b3261e;border-color:#b3261e}

  padding-inline-start:12px;border-inline-start:3px solid var(--accent)}

.arttw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:var(--r-sm)}
.arttbl{border-collapse:collapse;width:100%;min-width:480px;font-size:13px}
.arttbl th,.arttbl td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);
  vertical-align:top;line-height:1.65}
.arttbl th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--ink-2);white-space:nowrap}
.arttbl tr:last-child td{border-bottom:0}
.artul{margin:10px 0;padding-inline-start:20px}
.artul li{margin-bottom:6px;line-height:1.8}
.artsub:first-child{margin-top:0}
.acchead{padding:18px 2px 10px}
.acchead h2{margin:0 0 4px;font-size:21px}
.accsub{color:var(--faint);font-size:12.5px;margin-bottom:12px}
.accinput{width:100%;max-width:420px;padding:9px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:13px}
.accinput:focus{outline:none;border-color:var(--accent)}
.accnote{color:var(--faint);font-size:11.5px;margin-top:8px}
.accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:9px;padding-bottom:40px}
.acccard{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);cursor:pointer;transition:border-color .12s,transform .12s}
.acccard:hover{border-color:var(--accent);transform:translateY(-1px)}
.accmain{flex:1;min-width:0}
.accname{font-weight:650;font-size:14px;line-height:1.35}
.accnew{font-size:10px;background:var(--accent);color:#fff;border-radius:5px;padding:1px 5px;vertical-align:middle}
.acchandle{color:var(--faint);font-size:11.5px;direction:ltr;text-align:right}
.accbio{color:var(--faint);font-size:11.5px;margin-top:4px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.accright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.accn{font-size:11px;color:var(--faint);text-align:center;line-height:1.2}
.accn b{display:block;font-size:16px;color:var(--fg)}
.accn.zero b{color:var(--faint);opacity:.6}
.accf{font-size:10.5px;color:var(--faint)}
.accx{color:var(--faint);margin-top:2px}
.accx:hover{color:var(--accent)}
.iconbtn.addbtn:hover{filter:brightness(1.06)}
.addbox{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px;
  box-shadow:0 18px 50px rgba(60,45,35,.22);border:1px solid var(--line)}
.addbox h4{margin:0 0 4px;font-size:16.5px;font-weight:600}
.addbox .sub{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 14px}
.addbox input[type=url],.addbox input[type=text]{width:100%;padding:12px 13px;border:1px solid var(--line);
  border-radius:10px;font:inherit;font-size:14px;background:#fdfcfb;direction:ltr;text-align:left}
.addbox input:focus{outline:none;border-color:var(--accent);background:#fff}
.addbox textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:13.5px;background:#fdfcfb;margin-top:9px;resize:vertical;min-height:62px}
.addrow{display:flex;gap:9px;margin-top:14px}
.addrow button{flex:1;padding:12px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff}
.addrow .go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.addrow .go:disabled{opacity:.45;cursor:not-allowed}
.addnote{margin-top:13px;padding:11px 13px;border-radius:10px;background:#fdf7f3;border:1px solid #efe1d8;
  color:#7a5a44;font-size:12.5px;line-height:1.7}
.addnote b{color:#5d4433}
.addkinds{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.addkind{font-size:11.5px;padding:3px 9px;border-radius:20px;background:#f5f1ee;color:var(--muted);border:1px solid var(--line)}
.addkind.on{background:#fdf0e8;color:#a85c30;border-color:#e9cdbb;font-weight:600}

/* تقرير الحسابات */
.accrepbtn{margin:12px 0 4px}
/* شريط نوع الحساب — يصفّي، بخلاف .rpsort الذي يرتّب. لذلك أثقل بصريًّا:
   حدٌّ أوضح وعدّادٌ داخل الزر، كي يُقرأ الفرق بين «مَن يظهر» و«بأي ترتيب». */
.rptypes{margin:14px 0 4px;display:flex;gap:6px;flex-wrap:wrap}
.rptypeb{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;display:inline-flex;
  align-items:center;gap:6px;transition:.14s;white-space:nowrap}
.rptypeb:hover{border-color:var(--accent);color:var(--ink)}
.rptypeb b{font-family:inherit;font-size:11px;font-weight:600;color:var(--faint);
  background:var(--surface-2);border-radius:999px;padding:1px 6px;min-width:20px;text-align:center}
.rptypeb.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.rptypeb.on b{background:rgba(255,255,255,.22);color:#fff}
/* «متوقّف» يُقرأ قبل أي شيء آخر في الصف — الحساب المتوقّف يبقى معروضًا
   لأن بطاقاته باقية، فلا بدّ أن يقول عن نفسه إنه لم يعد يُسحب. */
.rptag.off{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.rpstopped{font-size:11.5px;color:var(--warn);background:var(--warn-soft);
  border:1px solid var(--warn);border-radius:8px;padding:4px 9px;white-space:nowrap;text-align:center}
.accoff{display:inline-block;font-size:11px;color:var(--warn);background:var(--warn-soft);
  border:1px solid var(--warn);border-radius:999px;padding:1px 8px;margin-top:3px}
.rptag{font-size:11.5px;padding:2.5px 8px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--muted);white-space:nowrap}
.rpsort{margin:12px 0 2px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rpsortb{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.rpsortb:hover{border-color:var(--accent)}
.rpsortb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.rplist{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.rplist.dim{opacity:.72}
.rprow{display:flex;align-items:flex-start;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.rprow:hover{border-color:var(--accent)}
.rprank{flex:0 0 auto;min-width:24px;font-weight:700;color:var(--faint);font-size:13px;padding-top:9px}
.rpmain{flex:1;min-width:0}
.rpname{font-weight:600;font-size:14.5px;cursor:pointer}
.rpname:hover{color:var(--accent)}
.rphandle{font-weight:400;font-size:12px;color:var(--faint);direction:ltr;display:inline-block}
.rpchips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 6px}
.rpchip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.rpchip.core{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rpchip.zero{color:var(--faint)}
.rpchip b{font-weight:700}
.rpmeta{display:flex;flex-wrap:wrap;gap:4px 13px;font-size:11.5px;color:var(--muted)}
.rpright{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:96px}
.rpscore{text-align:center}
.rpscore b{display:block;font-size:21px;font-weight:700;line-height:1.1;color:var(--accent)}
.rpscore span{font-size:10.5px;color:var(--faint)}
.rpbar{height:4px;border-radius:99px;background:var(--line);margin-top:5px;overflow:hidden}
.rpbar i{display:block;height:100%;background:var(--accent)}
.rpstop{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;
  padding:5px 10px;font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}
.rpstop:hover{border-color:#c2410c;color:#c2410c}
.rpsep{margin:26px 0 4px;font-weight:600;font-size:14px}
.rpsep span{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:640px){
  .rprow{flex-wrap:wrap}
  .rpright{flex-direction:row;align-items:center;justify-content:space-between;width:100%}
  .rpbar{width:120px}
}
</style>
</head>
<body>
<header>
 <div class="hwrap">
  <div class="brand" onclick="go('#/')">
    <div class="dot"></div>
    <div><b>أفضل أدوات الذكاء الاصطناعي</b><span>رصد يومي · مصنَّف بالعربية</span></div>
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="ابحث في العناوين والملخصات والنصوص الأصلية…" autocomplete="off">
  </div>
  <div class="topstat" id="topstat"></div>
  <button class="iconbtn hb" id="refreshBtn" onclick="refreshData()" title="تحديث البيانات" aria-label="تحديث البيانات">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <div class="hbreak" aria-hidden="true"></div>
  <button class="iconbtn hb" onclick="openTray('liked')" title="ما أعجبني" aria-label="ما أعجبني">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    <span class="badge zero" id="bLike">0</span>
  </button>
  <button class="iconbtn hb" onclick="openTray('bm')" title="المحفوظات" aria-label="المحفوظات">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    <span class="badge zero" id="bBm">0</span>
  </button>
  <button class="iconbtn hb" onclick="go('#/accounts')" title="الحسابات المتابَعة" aria-label="الحسابات المتابَعة">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
  </button>
  <button class="iconbtn hb" onclick="openArticle()" title="أضف مقالة" aria-label="أضف مقالة">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M8 9h2"/></svg>
  </button>
  <button class="iconbtn addbtn" onclick="openAdd()" title="أضف رابطًا إلى اللوحة" aria-label="أضف رابطًا">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="iconbtn" onclick="toggleAside()" aria-label="الفلاتر">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
  </button>
 </div>
 <div class="upbar"><div class="upwrap" id="upbar"></div></div>
</header>
<div class="shell">
  <aside id="aside">
   <div class="fpad">
    <div class="fhead">
      <div class="live">
        <div><b id="liveCount">0</b> <span>بطاقة مطابقة</span></div>
        <button class="closebtn" onclick="toggleAside()" title="إغلاق الفلاتر">✕</button>
      </div>
    </div>
    <div id="filters"></div>
   </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<div id="boot" class="bootmsg"><div class="bootspin"></div><div>جارٍ تحميل البطاقات…</div></div>
<script>
(function(){
  var T0 = Date.now();
  function fail(msg){
    var b = document.getElementById('boot'); if(!b) return;
    b.innerHTML = '<b>تعذّر تحميل البيانات</b>'
      + '<div style="margin-top:6px;font-size:13px">' + msg + '</div>'
      + '<div style="margin-top:10px;font-size:12px;color:#8a8178">'
      + 'هذه الصفحة تُفتح عبر رابط https — لا بفتح الملف من القرص مباشرة.</div>';
  }
  function j(p){ return fetch(p, {cache:'no-cache'}).then(function(r){
      if(!r.ok) throw new Error(p + ' \u2192 ' + r.status); return r.json(); }); }
  j('data/manifest.json').then(function(man){
    return Promise.all([j('data/' + man.authors)].concat(
      man.shards.map(function(s){ return j('data/' + s); })
    )).then(function(all){
      var authors = all[0], items = [];
      for (var i = 1; i < all.length; i++) items = items.concat(all[i]);
      window.__RAW = { items: items, authors: authors, stats: man.stats };
      var b = document.getElementById('boot'); if(b) b.remove();
      var s = document.createElement('script');
      s.src = 'app.js?v=134b663a79';  /* بصمة محتوى app.js — تتغيّر مع كل تعديل عليه */
      s.onerror = function(){ fail('\u062a\u0639\u0630\u0651\u0631 \u062a\u062d\u0645\u064a\u0644 app.js'); };
      document.body.appendChild(s);
      console.log('[dash] ' + items.length + ' cards in ' + (Date.now() - T0) + 'ms');
    });
  }).catch(function(e){ fail(String((e && e.message) || e)); });
})();
</script>

</body>
</html>
