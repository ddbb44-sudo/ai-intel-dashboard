      - name: شاشة المتابَعون
        run: python .github/scripts/patch_accounts_view.py

      - name: تصحيح «أضفتها بنفسي» قبل أي سحب
        run: python .github/scripts/patch_mine_filter.py

      - name: السحب التاريخي الفائت
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          BF_HANDLE: ${{ github.event.inputs.backfill_handle }}
          BF_DAYS: '60'
          BF_DROP_RT: '1'
        run: |
          if [ -z "$BF_HANDLE" ]; then echo 'لا حساب — تخطٍّ'; exit 0; fi
          python .github/scripts/backfill_account.py

      - name: حفظ ونشر
        run: |
          git config user.name  'ai-intel-bot'
          git config user.email 'actions@github.com'
          git add app.js index.html data/ .github/scripts/
          if git diff --cached --quiet; then echo 'لا تغيير'; exit 0; fi
          git commit -m 'شاشة المتابَعون + «أضفتها بنفسي» للملصوق فقط + سحب BadwiNew'
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo '::error::فشل الدفع بعد ٣ محاولات'; exit 1; }

      - name: تقرير
        if: always()
        run: |
          if [ -f bf_report.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          r=json.load(open('bf_report.json'))
          print('### السحب التاريخي — @%s\n' % r.get('handle'))
          print('سُحب %d · مرشحون %d · قُرئ %d · **بطاقات %d** · $%.3f\n'
                % (r.get('pulled',0), r.get('candidates',0), r.get('read',0),
                   r.get('accepted',0), r.get('cost_estimate_usd',0)))
          d=r.get('dropped') or {}
          if d: print('أُسقط: ' + ' · '.join('%s %d'%(k,v) for k,v in d.items()) + '\n')
          for t in (r.get('titles') or []):
              print('- `%s` [%s](%s)' % (t['serial'], t['title'], t['url']))
          PY
          fi
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'https://ddbb44-sudo.github.io/ai-intel-dashboard/' >> $GITHUB_STEP_SUMMARY
