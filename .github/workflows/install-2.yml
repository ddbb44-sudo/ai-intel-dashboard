name: install-2

# ١) شاشة «المتابَعون» + زرها في الشريط العلوي
# ٢) «أضفتها بنفسي» = الروابط الملصوقة فقط (يسبق السحب عمدًا،
#    وإلا دخلت بطاقات بدوي القسم وحملت شارة «مضافة يدويًا» خطأً)
# ٣) تسجيل الحسابات الجديدة في authors.json (اسم وصورة ونبذة)
# ٤) السحب التاريخي الفائت لـ BadwiNew
# لا يلمس .github/workflows — GitHub يرفض ذلك من سير عمل.
on:
  workflow_dispatch:
    inputs:
      backfill_handle:
        description: 'حساب لسحب تاريخه (فارغ = تخطٍّ)'
        required: false
        default: 'BadwiNew'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: كتابة السكربتات
