name: daily

# السحب اليومي — يعمل على خوادم GitHub، لا يحتاج جهاز عزيز ولا موصّلات.
# ثلاثة مواعيد: 06:00 · 09:00 · 12:00 بتوقيت الرياض.
# السبب: جدولة GitHub للمستودعات المجانية تتأخر عشرات الدقائق، وقد تُسقط الموعد
# تمامًا (حدث فعلًا في 27 أغسطس 2026 — لم تُطلَق أي تشغيلة). الموعدان التاليان
# شبكة أمان. خطوة «هل سُحب اليوم؟» تُخرجهما فورًا إن نجح الأول، فلا تكلفة مكررة.
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: هل سُحب اليوم؟
        id: guard
        run: |
          DAY=$(date -u +%F)
          if [ -f "data/$DAY.json" ]; then
            echo "::notice::شارد $DAY موجود — سُحب اليوم مسبقًا. تخطٍّ قبل لمس Apify."
            echo "تخطٍّ: اليوم $DAY مسحوب مسبقًا." >> $GITHUB_STEP_SUMMARY
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "لم يُسحب $DAY بعد — نكمل."
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: السحب والتصنيف
        if: steps.guard.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS }}
          MAX_READ: ${{ vars.MAX_READ }}
          MAX_CARDS: ${{ vars.MAX_CARDS }}
        run: python .github/scripts/daily_pull.py

      - name: حفظ ونشر
        if: steps.guard.outputs.skip != '1' && env.DAILY_COUNT != ''
        run: |
          git config user.name  "ai-intel-bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "daily: ${DAILY_DAY} — ${DAILY_COUNT} بطاقة جديدة"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            sleep 5
          done

      - name: تقرير التشغيلة
        if: steps.guard.outputs.skip != '1' && env.DAILY_COUNT != ''
        run: |
          echo "### تحديث ${DAILY_DAY}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**${DAILY_COUNT} بطاقة جديدة**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${DAILY_REPORT}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://ddbb44-sudo.github.io/ai-intel-dashboard/" >> $GITHUB_STEP_SUMMARY

      - name: لا جديد
        if: steps.guard.outputs.skip != '1' && env.DAILY_NOTHING == '1'
        run: echo "لا منشورات جديدة تستحق بطاقة اليوم." >> $GITHUB_STEP_SUMMARY

      - name: نشر التقرير كطلب (يصل بريدًا عبر إشعارات GitHub)
        if: always() && steps.guard.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python .github/scripts/build_issue.py
          # العنوان يُقرأ من ملف لا من $GITHUB_ENV — الأخير لا يصل للخطوة التي كتبته
          TITLE="$(cat issue_title.txt)"
          if [ -z "$TITLE" ]; then
            echo "::error::عنوان التقرير فارغ — لن يُنشَر الطلب"
            exit 1
          fi
          # الوسم قد لا يكون موجودًا في مستودع جديد، و`gh` يفشل إن طلبت وسمًا غير موجود.
          # (فحص 22 أغسطس: وسم report لم يكن موجودًا أصلًا — عطل ثانٍ كان سيظهر بعد إصلاح العنوان.)
          gh label create report --color 0e8a16 --description "تقرير التشغيلة اليومية" 2>/dev/null || true
          url=$(gh issue create \
                 --title "$TITLE" \
                 --body-file issue_body.md \
                 --label report \
                 --assignee "${{ github.repository_owner }}")
          echo "التقرير: $url" >> $GITHUB_STEP_SUMMARY
          # يُغلق فورًا: الإشعار وصل، والقائمة تبقى نظيفة والسجل محفوظ
          gh issue close "$url"

      - name: بناء تقرير البريد
        if: always() && steps.guard.outputs.skip != '1'
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/build_email.py

      - name: إرسال التقرير بالبريد
        if: always() && steps.guard.outputs.skip != '1'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
        run: python .github/scripts/send_email.py

      - name: تنبيه عند الفشل
        if: steps.guard.outputs.skip != '1' && env.DAILY_ERROR != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf 'فشلت تشغيلة السحب اليومي.\n\n'
            printf '**السبب:** %s\n\n' "$DAILY_ERROR"
            printf 'سجل التشغيلة: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > /tmp/err.md
          gh issue create --title "عطل: السحب اليومي" --body-file /tmp/err.md --label ops
          echo "$DAILY_ERROR" >> $GITHUB_STEP_SUMMARY
          exit 1
