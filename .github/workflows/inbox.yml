name: inbox

# يعمل فور فتح طلب بوسم inbox، فتظهر البطاقة خلال ~دقيقتين.
# إن غاب المفتاح أو فشل شيء، يبقى الطلب مفتوحًا وتلتقطه المهمة المجدولة كل ساعة.
on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: inbox-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build-card:
    if: contains(join(github.event.issue.labels.*.name, ','), 'inbox')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: بناء البطاقة
        id: build
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python .github/scripts/process_issue.py

      - name: حفظ ونشر
        if: env.CARD_ID != ''
        run: |
          git config user.name  "ai-intel-bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "inbox: ${CARD_SERIAL} — ${CARD_TITLE}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            sleep 5
          done

      - name: إغلاق الطلب
        if: env.CARD_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf 'أُضيفت البطاقة **%s** — %s\n\n' "$CARD_SERIAL" "$CARD_TITLE"
            printf 'https://ddbb44-sudo.github.io/ai-intel-dashboard/#/c/%s\n\n' "$CARD_ID"
            printf 'قد تحتاج دقيقة حتى ينتهي نشر الصفحة.\n'
          } > /tmp/comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
          gh issue close "${{ github.event.issue.number }}"
