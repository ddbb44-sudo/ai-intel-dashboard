name: delete

# حذف بطاقة عبر طلب بوسم `delete`. باب الخروج الذي كانت اللوحة تفتقده.
on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: delete
  cancel-in-progress: false

jobs:
  remove:
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'delete')
      || startsWith(github.event.issue.title, 'حذف:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: حذف البطاقة
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/delete_card.py

      - name: حفظ ونشر
        if: env.DEL_ID != ''
        run: |
          git config user.name  "ai-intel-bot"
          git config user.email "actions@github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "::error::لم يتغيّر شيء رغم تنفيذ الحذف"; exit 1
          fi
          git commit -m "delete: ${DEL_SERIAL}"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::فشل الدفع بعد ٣ محاولات"; exit 1; }

      - name: التعليق والإغلاق
        if: env.DEL_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file delete_result.md
          gh issue close "${{ github.event.issue.number }}"
