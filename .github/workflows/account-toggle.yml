name: account-toggle

# إيقاف حساب عن السحب أو إعادة تشغيله، من زر داخل اللوحة.
# اللوحة كانت تملك بابًا للإضافة ولا باب للإيقاف — فأي حساب أضيف يبقى يُسحب للأبد.

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: account-toggle-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  toggle:
    if: >-
      startsWith(github.event.issue.title, 'إيقاف حساب:')
      || startsWith(github.event.issue.title, 'تشغيل حساب:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تغيير حالة الحساب
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/toggle_account.py

      - name: حفظ ونشر
        if: env.TOGGLED_HANDLE != ''
        run: |
          git config user.name  "ai-intel-bot"
          git config user.email "actions@github.com"
          git add accounts.json
          if git diff --cached --quiet; then
            echo "لا تغيير في الملف"; exit 0
          fi
          git commit -m "account: ${TOGGLED_STATE} @${TOGGLED_HANDLE}"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::فشل الدفع بعد ٣ محاولات"; exit 1; }
