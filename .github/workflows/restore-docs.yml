name: restore-docs

on:
  push:
    paths:
      - '.github/workflows/restore-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append sections 31-32 then remove this workflow
        run: |
          F="docs/00-التعليمات.md"
          if grep -q '^## 31\.' "$F"; then echo "already appended"; else
          printf '\n' >> "$F"
          cat >> "$F" <<'MDEOF'
          ## 31. حفظ الإعجابات والمحفوظات — المزامنة عبر المستودع (قرار 21 أغسطس 2026)
          **المشكلة:** الإعجابات والبوكمارك كانت تُحفظ في `localStorage` فقط — أي في متصفح واحد.
          تُفقد عند مسح بيانات المتصفح، ولا تظهر على الجوال، وسفاري يمسحها تلقائيًا بعد 7 أيام خمول.
          
          **الحل المعتمد (اختاره عزيز صراحةً: «لا تهمني السرية… أهم شي التخزين… بسّط الأمور»):**
          ملف `prefs.json` في جذر المستودع — عام للقراءة، والكتابة بتوكن يضعه عزيز في اللوحة.
          
          - **القراءة:** تلقائية على كل جهاز من الرابط الخام — **بلا أي إعداد ولا توكن**.
          - **الكتابة:** تحتاج توكن GitHub دقيق الصلاحية (fine-grained) يُلصق مرة واحدة في زر «مزامنة»
            أسفل لوحة الفلاتر، ويُخزَّن في `localStorage` تحت `aiintel.synctoken`.
          - **الدمج اتحاد لا استبدال** — جهازان يعملان معًا دون أن يمسح أحدهما الآخر.
          - **الحفظ محلي فوري** ثم يُرفع بعد 3 ثوانٍ (debounce). فشل الرفع لا يكسر شيئًا:
            البيانات محفوظة محليًا والحالة تظهر «فشل» في الزر.
          - **تعارض 409/422:** يُعاد جلب `sha` ثم تُعاد المحاولة مرة واحدة.
          
          **مواصفة التوكن — الأربعة معًا وإلا فشل الرفع بـ403:**
          
          | الحقل | القيمة الصحيحة |
          |---|---|
          | النوع | Fine-grained personal access token |
          | Repository access | **Only select repositories** ← `ai-intel-dashboard` |
          | Repository permissions ← Contents | **Read and write** |
          | Metadata | Read-only (يُضاف تلقائيًا) |
          
          **خطأ شائع وقع فعلًا (21 أغسطس):** أُنشئ التوكن بلا اختيار مستودع وبلا صلاحيات إطلاقًا.
          النتيجة: `GET` ينجح (لأن المستودع عام أصلًا فلا يثبت شيئًا) و`PUT` يرجع
          `403 Resource not accessible by personal access token`.
          **القاعدة:** نجاح القراءة لا يثبت صلاحية الكتابة في مستودع عام — الاختبار الحقيقي هو `PUT`.
          التوكن يُعدَّل في مكانه من صفحته دون إعادة توليد ودون إعادة لصق.
          
          **قبل تفعيل المزامنة على أي جهاز:** اضغط «تصدير» واحفظ الملف.
          
          ## 32. سقوف السحب وعدالة التوزيع (قرار 21 أغسطس 2026)
          - `MAX_READ` هو أقصى عدد تغريدات تُقرأ بالذكاء الاصطناعي يوميًا (الافتراضي 250)،
            و`MAX_CARDS` أقصى عدد بطاقات تُنشأ (الافتراضي 60). السحب من Apify **لا سقف له**:
            كل الحسابات تُسحب دائمًا، والسقف يقع على القراءة لا على السحب.
          - **التوزيع دوري (round-robin) لا ترتيبًا بالتفاعل الخام.** الترتيب بالتفاعل وحده
            أقصى في المحاكاة 28 حسابًا من 69 — ومنها كل الحسابات العربية الصغيرة الثمانية.
            الآلية الصحيحة: أفضل تغريدة من كل حساب أولًا، ثم الثانية من كل حساب، وهكذا حتى السقف.
          - **لا سقف صامت:** كلما استُبعد شيء بسبب سقف، يُذكر العدد وأسماء الحسابات المتأثرة في التقرير.
          - **التعليقات تحت التغريدات لا تُقرأ إطلاقًا** — لا تُسحب من Apify أصلًا،
            فلا كلفة عليها ولا أثر لها على التصنيف.
          MDEOF
          fi
          rm -f .github/workflows/restore-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: 31 مزامنة الإعجابات ومواصفة التوكن، 32 السقوف وعدالة التوزيع" || echo "nothing"
          git push
