name: account

# إضافة حساب متابَع بضغطة: طلب بوسم `account` ← تحقّق ← إضافة ← سحب 60 يومًا ← إغلاق.
# نفس مسار inbox الذي تعرفه، لكن للحسابات بدل الروابط.
on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: account
  cancel-in-progress: false

jobs:
  add:
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'account')
      || startsWith(github.event.issue.title, 'حساب:')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: التحقق والإضافة إلى accounts.json
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python .github/scripts/add_account.py

      - name: حفظ الحساب الجديد
        run: |
          if [ ! -s new_handles.txt ]; then
            echo "لا حساب جديد — لا شيء ليُحفظ"; exit 0
          fi
          git config user.name  "ai-intel-bot"
          git config user.email "actions@github.com"
          git add accounts.json
          git diff --cached --quiet || git commit -m "account: إضافة $(tr '\n' ' ' < new_handles.txt)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::فشل الدفع بعد ٣ محاولات"; exit 1; }

      - name: السحب التاريخي لكل حساب جديد
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          BF_DAYS: ${{ vars.BF_DAYS || '60' }}
          BF_DROP_RT: ${{ vars.BF_DROP_RT || '1' }}
        run: |
          if [ ! -s new_handles.txt ]; then exit 0; fi
          : > backfill_all.md
          while read -r h; do
            [ -z "$h" ] && continue
            echo "== سحب تاريخي: $h =="
            BF_HANDLE="$h" python .github/scripts/backfill_account.py || echo "فشل السحب لـ $h"
            if [ -f bf_report.json ]; then
              python - "$h" <<'PY' >> backfill_all.md
          import json, sys
          h = sys.argv[1]
          r = json.load(open('bf_report.json'))
          print("\n### @%s — آخر %s يومًا\n" % (h, r.get('days')))
          print("سُحب %d · مرشحون %d · قُرئ %d · **بطاقات %d** · $%.3f"
                % (r.get('pulled',0), r.get('candidates',0), r.get('read',0),
                   r.get('accepted',0), r.get('cost_estimate_usd',0)))
          d = r.get('dropped') or {}
          if d:
              print("\nأُسقط: " + " · ".join("%s %d" % (k,v) for k,v in d.items()))
          ts = r.get('titles') or []
          if ts:
              print("\n<details><summary>%d بطاقة</summary>\n" % len(ts))
              for t in ts:
                  print("- `%s` [%s](%s)" % (t['serial'], t['title'], t['url']))
              print("\n</details>")
          PY
              rm -f bf_report.json
            fi
          done < new_handles.txt

      - name: حفظ البطاقات
        run: |
          if [ ! -s new_handles.txt ]; then exit 0; fi
          git config user.name  "ai-intel-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "لا بطاقات جديدة"; exit 0
          fi
          git commit -m "account: بطاقات السحب التاريخي لـ $(tr '\n' ' ' < new_handles.txt)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::فشل الدفع بعد ٣ محاولات"; exit 1; }

      - name: التعليق والإغلاق
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s new_handles.txt ]; then
            echo "لا حساب جديد — الطلب يبقى مفتوحًا ليراه عزيز"; exit 0
          fi
          {
            echo "## تمّت الإضافة"
            echo ""
            cat backfill_all.md 2>/dev/null || echo "لم يُنتج السحب التاريخي تقريرًا."
            echo ""
            echo "الحساب الآن ضمن السحب اليومي (06:00 بتوقيت الرياض)."
            echo ""
            echo "https://ddbb44-sudo.github.io/ai-intel-dashboard/"
          } > /tmp/c.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/c.md
          gh issue close "${{ github.event.issue.number }}"
