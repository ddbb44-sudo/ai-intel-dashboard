      - name: تصميم صفحة المقالة
        run: python .github/scripts/patch_article_ui.py

      - name: زر الحذف
        run: python .github/scripts/patch_delete_ui.py

      - name: ختم بصمة app.js (آخر خطوة دائمًا)
        run: python .github/scripts/patch_icon_cache.py

      - name: إنشاء وسم delete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create delete --color B3261E \
            --description 'حذف بطاقة من اللوحة' 2>/dev/null || echo 'الوسم موجود'

      - name: حفظ ونشر
        run: |
          git config user.name  'ai-intel-bot'
          git config user.email 'actions@github.com'
          git add app.js index.html .github/scripts/
          [ -f site.webmanifest ] && git add site.webmanifest || true
          if git diff --cached --quiet; then echo 'لا تغيير'; exit 0; fi
          git commit -m 'تصميم صفحة المقالة + زر الحذف + دمج التكرار + إعادة بناء الجداول'
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo '::error::فشل الدفع بعد ٣ محاولات'; exit 1; }

      - name: تقرير
        run: |
          {
            echo '### رُكِّب التصميم وزر الحذف'
            echo ''
            echo '- الرابط صار زرًّا واضحًا فوق الجدول'
            echo '- الجدول العريض يصير بطاقات على الجوال'
            echo '- زر سلة في أعلى صفحة البطاقة للحذف'
            echo ''
            echo 'تأكد أن `.github/workflows/delete.yml` مرفوع.'
            echo 'ثم أعد إضافة المقالة وقارن، واحذف القديمة بزر السلة.'
          } >> $GITHUB_STEP_SUMMARY
