name: install-7

# ١) تصميم صفحة المقالة كما وافق عليه عزيز: الرابط زرٌّ لا خانة في آخر جدول
# ٢) زر حذف البطاقة — باب الخروج الذي كانت اللوحة تفتقده
# ٣) إصلاح التكرار: لصق Google Docs يحمل نسختين متكاملتين، تُدمجان لا تُختار
# ٤) إعادة بناء الجداول التي سطّحها اللصق إلى خلية في كل سطر
# ملف delete.yml ترفعه بنفسك — GitHub يمنع سير عمل من إنشاء سير عمل آخر.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

