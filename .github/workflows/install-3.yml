      - name: تعديل اللوحة
        run: python .github/scripts/patch_article_view.py

      - name: إنشاء وسم article
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create article --color 5319E7 \
            --description 'مقالة كاملة: نص ملصوق أو رابط' 2>/dev/null \
            || echo 'الوسم موجود مسبقًا'

      - name: حفظ ونشر
        run: |
          git config user.name  'ai-intel-bot'
          git config user.email 'actions@github.com'
          git add app.js index.html .github/scripts/
          if git diff --cached --quiet; then echo 'لا تغيير — رُكِّب مسبقًا'; exit 0; fi
          git commit -m 'ميزة المقالات: زر ونوع مصدر وعرض بفقرات'
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo '::error::فشل الدفع بعد ٣ محاولات'; exit 1; }

      - name: تقرير
        run: |
          {
            echo '### رُكِّبت ميزة المقالات'
            echo ''
            echo 'تأكد أن `.github/workflows/article.yml` مرفوع (ترفعه بنفسك).'
            echo ''
            echo 'ثم: اللوحة ← زر الورقة 📄 ← «عندي نص» أو «عندي رابط».'
          } >> $GITHUB_STEP_SUMMARY
