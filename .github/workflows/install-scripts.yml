name: install-scripts

# يركّب سكربتات آلية الحسابات ويعدّل app.js.
# لا يلمس أي ملف داخل .github/workflows — GitHub يرفض أن ينشئ سير عملٍ سير عملًا آخر،
# وهو سبب فشل المحاولة الأولى. ملف account.yml تحمّله بنفسك.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

