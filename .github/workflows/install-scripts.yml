      - name: تعديل app.js
        run: python .github/scripts/patch_appjs.py

      - name: إنشاء وسم account
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create account --color 1D76DB \
            --description 'إضافة حساب X للمتابعة اليومية' 2>/dev/null \
            || echo 'الوسم موجود مسبقًا'

      - name: حفظ ونشر
        run: |
          git config user.name  'ai-intel-bot'
          git config user.email 'actions@github.com'
          git add .github/scripts/add_account.py \
                  .github/scripts/backfill_account.py \
                  .github/scripts/patch_appjs.py app.js
          if git diff --cached --quiet; then echo 'لا تغيير — رُكِّب مسبقًا'; exit 0; fi
          git commit -m 'سكربتات آلية إضافة الحسابات + تمييز رابط الحساب في اللوحة'
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo '::error::فشل الدفع بعد ٣ محاولات'; exit 1; }

      - name: تقرير
        run: |
          {
            echo '### رُكِّبت السكربتات'
            echo ''
            echo 'تأكد أن `.github/workflows/account.yml` موجود (ترفعه بنفسك).'
            echo ''
            echo 'ثم: اللوحة ← زر **+** ← الصق `https://x.com/USERNAME` ← تأكيد.'
          } >> $GITHUB_STEP_SUMMARY
