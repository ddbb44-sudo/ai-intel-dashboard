name: docs-34

on:
  push:
    paths:
      - '.github/workflows/docs-34.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append section 34 then self-remove
        run: |
          F="docs/00-التعليمات.md"
          if grep -q '^## 34\.' "$F"; then echo "already there"; else
          cat >> "$F" <<'MDEOF'
          
          ## 34. تقرير التشغيلة اليومي — عطل ‏`title can't be blank` وإصلاحه (22 أغسطس 2026)
          **العَرَض:** ظنّ عزيز أن السحب لم يتم يوم 22 أغسطس. **الحقيقة:** السحب تم ونجح
          (1,698 تغريدة من 68 من 69 حسابًا · 26 بطاقة جديدة · رُفعت وظهرت على اللوحة في 7:01 صباحًا).
          الذي فشل هو **خطوة نشر التقرير** — وهي قناة الإبلاغ الوحيدة، فبلا تقرير لا إشعار ولا بريد،
          فبدا كأن شيئًا لم يحدث.
          
          **السبب الجذري:** كان `build_issue.py` يكتب `ISSUE_TITLE` في `$GITHUB_ENV`، ثم يقرأه
          `gh issue create` في **الخطوة نفسها**.
          
          > **قاعدة GitHub Actions:** ما يُكتب في `$GITHUB_ENV` لا يظهر إلا في الخطوات **التالية**،
          > ولا يظهر أبدًا في الخطوة التي كتبته.
          
          فكان العنوان فارغًا لحظة الإنشاء، وترد GitHub: `title can't be blank`.
          
          **عطل ثانٍ كان مختبئًا خلفه:** وسم `report` لم يكن موجودًا في المستودع أصلًا، و`gh` يفشل
          إن طُلب وسم غير موجود — أي أن إصلاح العنوان وحده كان سيُنتج فشلًا جديدًا.
          
          **الإصلاح:**
          1. العنوان يُكتب في `issue_title.txt` ويُقرأ منه: `TITLE="$(cat issue_title.txt)"`.
          2. فحص صريح: إن كان العنوان فارغًا تفشل الخطوة برسالة واضحة بدل تمرير قيمة فارغة.
          3. `gh label create report ... || true` قبل الإنشاء — إنشاء الوسم إن غاب، بلا فشل إن وُجد.
          
          **تحقّق حي (تشغيلة #6):** نجحت في 7 دقائق، وأُنشئ الطلب **#4** بعنوانه الصحيح
          وبوسم `report` ومُسندًا إلى عزيز — أي أن الإشعار يصل فعلًا.
          
          ### الدرس الملزم
          - **اختبار السحب لا يساوي اختبار الإبلاغ.** كل قناة إبلاغ تُختبر حتى وصولها، لا حتى
            خروجها من السكربت. هذه الخطوة كانت تفشل كل يوم منذ كتابتها ولم يلاحظها أحد لأن
            أحدًا لم يتحقق من وصول الإشعار.
          - **لا تمرير قيمة عبر متغيّر بيئة داخل الخطوة نفسها.** الملف أو `$GITHUB_OUTPUT`
            مع خطوة تالية، لا `$GITHUB_ENV` مع نفس الخطوة.
          - **لا فشل صامت في قناة الإبلاغ:** كل قيمة مطلوبة يسبقها فحص فراغ ورسالة `::error::`.
          MDEOF
          fi
          rm -f .github/workflows/docs-34.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: 34 عطل تقرير التشغيلة وإصلاحه" || echo nothing
          git push
