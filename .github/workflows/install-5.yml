      - name: عرض الجداول والقوائم
        run: python .github/scripts/patch_tables.py

      - name: ختم بصمة app.js (آخر خطوة دائمًا)
        run: python .github/scripts/patch_icon_cache.py

      - name: حفظ ونشر
        run: |
          git config user.name  'ai-intel-bot'
          git config user.email 'actions@github.com'
          git add app.js index.html .github/scripts/ site.webmanifest 2>/dev/null || true
          git add app.js index.html .github/scripts/
          if git diff --cached --quiet; then echo 'لا تغيير'; exit 0; fi
          git commit -m 'مقالات: تنظيف اللصق من HTML + جداول + إلغاء نسبة الرابط الداخلي'
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo '::error::فشل الدفع بعد ٣ محاولات'; exit 1; }

      - name: تقرير
        run: |
          {
            echo '### أُصلحت معالجة المقالات'
            echo ''
            echo 'أعد إضافة المقالة نفسها — ستُنظَّف من HTML وتبقى جداولها جداول.'
          } >> $GITHUB_STEP_SUMMARY
