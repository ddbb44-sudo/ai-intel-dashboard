name: install-5

# إصلاح ثلاثة أعطال كشفتها بطاقة c870:
# ١) اللصق من Google Docs يحمل HTML بأنماطه — 53% من المدخل كان ضجيجًا
# ٢) الجداول كانت تُسطَّح إلى أسطر «مفتاح: قيمة» — الآن تبقى جداول
# ٣) رابط داخل المتن كان يُنسب كمصدر للمقالة — أُلغي
# ويعيد ختم بصمة app.js في آخر خطوة كي يصل التعديل للمتصفح فورًا.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

