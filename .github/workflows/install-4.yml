      - name: تركيب الأيقونة وبصمة الذاكرة المؤقتة
        run: python .github/scripts/patch_icon_cache.py

      - name: حفظ ونشر
        run: |
          git config user.name  'ai-intel-bot'
          git config user.email 'actions@github.com'
          git add index.html site.webmanifest favicon.ico favicon-16.png favicon-32.png \
                  apple-touch-icon.png icon-192.png icon-512.png .github/scripts/
          if git diff --cached --quiet; then echo 'لا تغيير'; exit 0; fi
          git commit -m 'أيقونة اللوحة + ربط نسخة app.js ببصمة محتواه'
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo '::error::فشل الدفع بعد ٣ محاولات'; exit 1; }

      - name: تقرير
        run: |
          {
            echo '### رُكِّبت الأيقونة وأُصلحت الذاكرة المؤقتة'
            echo ''
            echo 'من الآن أي تعديل على app.js يصل للمتصفح فورًا بلا تحديث قسري.'
            echo ''
            echo 'https://ddbb44-sudo.github.io/ai-intel-dashboard/'
          } >> $GITHUB_STEP_SUMMARY
