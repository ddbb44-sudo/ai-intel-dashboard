name: install-6

# قاعدة عزيز (31 أغسطس): النص الملصوق لا يُعدَّل ولا يُعاد صياغته ولا يُضاف إليه.
# فصار النص يُرتَّب ببايثون حرفيًا، ولا يُطلب من النموذج إلا العنوان والوسوم.
# ومعه: حفظ روابط المقالة (كانت تُمحى)، وقراءة مريحة على الجوال.
