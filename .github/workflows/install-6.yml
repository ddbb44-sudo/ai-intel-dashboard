      - name: جداول وروابط وتنسيق الجوال
        run: python .github/scripts/patch_tables.py

      - name: ختم بصمة app.js (آخر خطوة دائمًا)
        run: python .github/scripts/patch_icon_cache.py

      - name: حفظ ونشر
        run: |
          git config user.name  'ai-intel-bot'
          git config user.email 'actions@github.com'
          git add app.js index.html .github/scripts/
          [ -f site.webmanifest ] && git add site.webmanifest || true
          if git diff --cached --quiet; then echo 'لا تغيير'; exit 0; fi
          git commit -m 'المقالات: النص الملصوق حرفي بلا تعديل + حفظ الروابط + قراءة الجوال'
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo '::error::فشل الدفع بعد ٣ محاولات'; exit 1; }

      - name: تقرير
        run: |
          {
            echo '### النص الملصوق صار حرفيًا'
            echo ''
            echo '- لا إعادة صياغة ولا ملاحظات ولا إضافات — ترتيب فقرات فقط'
            echo '- روابط المقالة محفوظة وقابلة للنقر'
            echo '- النموذج يختار العنوان والوسوم فحسب'
            echo ''
            echo 'أعد إضافة المقالة نفسها وقارن.'
          } >> $GITHUB_STEP_SUMMARY
