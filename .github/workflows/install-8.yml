      - name: الفحص قبل الإصلاح
        run: python .github/scripts/lint_design.py || true

      - name: إصلاح أزرار الشريط
        run: python .github/scripts/patch_icon_peers.py

      - name: الفحص بعد الإصلاح (يفشل عند أي مخالفة)
        run: python .github/scripts/lint_design.py

      - name: ختم بصمة app.js
        run: python .github/scripts/patch_icon_cache.py

      - name: حفظ ونشر
        run: |
          git config user.name  'ai-intel-bot'
          git config user.email 'actions@github.com'
          git add design.md index.html app.js .github/scripts/
          [ -f site.webmanifest ] && git add site.webmanifest || true
          if git diff --cached --quiet; then echo 'لا تغيير'; exit 0; fi
          git commit -m 'design.md + فحص آلي + إصلاح أقران أزرار الشريط'
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo '::error::فشل الدفع بعد ٣ محاولات'; exit 1; }

      - name: تقرير
        run: |
          {
            echo '### رُكِّب design.md والفحص الآلي'
            echo ''
            echo '- `design.md` في جذر المستودع — اقرأه قبل أي تعديل'
            echo '- `lint_design.py` يفشل التشغيلة عند أي مخالفة ميكانيكية'
            echo '- أيقونة المقالة صارت مطابقة لإخوتها'
          } >> $GITHUB_STEP_SUMMARY
