name: docs-33

on:
  push:
    paths:
      - '.github/workflows/docs-33.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append section 33 then self-remove
        run: |
          F="docs/00-التعليمات.md"
          if grep -q '^## 33\.' "$F"; then echo "already there"; else
          cat >> "$F" <<'MDEOF'
          
          ## 33. التصنيف المعتمد — ثلاثة محاور (قرار عزيز 21 أغسطس 2026)
          **السبب:** كان التصنيف 25 نوع محتوى و41 مجالًا، بمتوسط 3.5 وسم لكل بطاقة.
          النتيجة أخطاء موثّقة: خبر عن Stripe وُسم `Agent` · ميزة في ChatGPT وُسمت `Skill` و`Agent` ·
          تقرير حكومي وُسم `Dataset` و`E-commerce`. والسبب الجذري **الإفراط في الوسم**
          لا الأسماء وحدها. وكان `AI` على 550 من 608 بطاقة — فلتر يعيد 90% من اللوحة ليس فلترًا.
          
          ### أ. نوع المحتوى — واحد فقط لكل بطاقة (٧)
          `إصدار` · `أداة` · `شرح` · `تجربة` · `بحث وقياس` · `رأي` · `خبر`
          - إن أعلن المنشور شيئًا جديدًا فهو **إصدار** لا خبر.
          - إن كان جوهره تعليم القارئ كيف يفعل شيئًا فهو **شرح** لا أداة.
          - **خبر** للسوق: استحواذ · تمويل · سياسة · تعطّل.
          
          ### ب. نوع الأداة — ٠ إلى ٢، وفقط مع «أداة» أو «إصدار» (٨)
          `MCP` · `Skill` · `Agent` · `Plugin` · `Prompt` · `API/SDK` · `تطبيق` · `نموذج`
          - تبقى بالإنجليزية حسب §11. `تطبيق` و`نموذج` بالعربية لأنهما ليسا مصطلحين محجوزين.
          - `MCP` لخادم أو موصّل MCP تحديدًا، لا لمجرد ذكر الكلمة. وكذلك `Agent`.
          
          ### ج. المجال — واحد رئيسي + ثانٍ عند اللزوم (١٣)
          `برمجة وهندسة` · `أعمال وإدارة` · `تصميم وواجهات` · `تسويق ومحتوى` · `نماذج وLLM` ·
          `بيانات وتحليلات` · `بحث وتعليم` · `إنتاجية شخصية` · `فيديو وصوت` · `أمن سيبراني` ·
          `روبوتات وعتاد` · `صحة` · `إسلامي`
          - **`AI` محذوف نهائيًا.** كل اللوحة عن الذكاء الاصطناعي.
          - الدمج: Design+UI+UX+Creative ← تصميم وواجهات · Marketing+SEO+Content+Media+Sales+E-commerce ← تسويق ومحتوى ·
            SW Dev+Coding+DevOps+Engineering ← برمجة وهندسة · Business+Management+Operations+Product+Finance+Legal ← أعمال وإدارة.
          
          ### د. قاعدة المجال الثاني — الجمهور لا الموضوع
          التمريرة الأولى أعطت 1.12 مجال لكل بطاقة، فسقطت بطاقات يحتاجها المصمّم أو المسوّق
          لأن «موضوعها الرئيسي» شيء آخر: مهارة `/animate-expo` صُنِّفت «برمجة وهندسة» فقط
          رغم أنها شغل واجهات. **القاعدة:** يُضاف مجال ثانٍ حين يبحث أهله عن البطاقة فعلًا
          ولو لم تكن موضوعها. تمريرة `retag2.py` **تضيف ولا تحذف**، ورفعت المتوسط إلى 1.25
          وتصميم وواجهات من 36 إلى 48 وتسويق ومحتوى من 16 إلى 24.
          
          ### هـ. القاعدة الحاكمة
          **الوسم الذي لا يمكن الدفاع عنه من نص البطاقة لا يوضع.** اثنان صحيحان خير من خمسة أحدها خاطئ.
          
          ### و. التنفيذ
          - `.github/scripts/taxonomy.py` — **المفردات المعلنة، المصدر الوحيد للحقيقة**. أي وسم خارجها يُرفض ويُذكر في التقرير.
          - `.github/scripts/retag.py` + `retag.yml` — إعادة التصنيف الكاملة (608 بطاقة في دقيقتين).
          - `.github/scripts/retag2.py` + `retag-audience.yml` — تمريرة المجال حسب الجمهور.
          - **لا تمسّ:** الأرقام التسلسلية · النصوص العربية · الروابط · المقاييس · الكيانات · طبيعة التغيير · الإعجابات والمحفوظات.
          - حقل جديد في كل بطاقة: `tool_types` — يوجد دائمًا ولو فارغًا.
          - عند تغيير المفردات لاحقًا: عدّل `taxonomy.py` و`DECLARED` في `tpl_js.html` **معًا**، ثم شغّل `retag`.
          MDEOF
          fi
          rm -f .github/workflows/docs-33.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: 33 التصنيف المعتمد بثلاثة محاور" || echo nothing
          git push
